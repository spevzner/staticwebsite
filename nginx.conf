server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths (client-side routes) resolve to index.html.
    # /admin has no backing API in production — it renders and shows its own
    # "CMS only available in development" message, by design.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
